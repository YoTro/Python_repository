# Workflow Default Configurations
# These values are used when no job-level override is provided.
# Override by passing params in the job request.

product_screening:
  # Stage 1: Basic filters
  price_min: 20
  price_max: 40
  weight_min: 20        # grams
  weight_max: 1000      # grams
  rating_min: 4.2
  rating_max: 4.5
  daily_sales_min: 30
  daily_sales_max: 40

  # Stage 2: Competition
  us_seller_ratio_min: 0.80

  # Stage 3: Profitability
  cost_ratio_max: 0.30       # cost < 30% of selling price
  profit_margin_min: 0.30    # profit margin > 30%

  # Stage 4: Compliance
  epa_status_allowed:
    - exempt
    - not_required

  # Stage 5: Advertising
  ad_traffic_ratio_max: 0.35  # Individual ASIN: Filter out if >35% traffic from ads
  enable_ad_analysis_xiyou: true

  # Stage 6: Social media (optional)
  enable_social_analysis: true
  enable_patent_check: true

  # Execution settings
  search_max_pages: 3         # pages to search for candidates
  parallel_concurrency: 5     # max parallel extractor calls

competitor_monitor:
  check_interval_hours: 4
  price_change_alert_pct: 0.10
  stock_drop_alert_pct: 0.50

review_analysis:
  max_reviews_per_product: 100
  sample_positive: 50
  sample_negative: 50
  sample_neutral: 50

bsr_collection:
  max_pages: 2
  categories: []

ad_diagnosis:
  # ── Observation window ────────────────────────────────────────────────────
  days: 30                      # lookback period for all SP reports
  benchmark_time_unit: WEEKLY    # crossProgramBenchmarks granularity: DAILY (max 90d), WEEKLY/MONTHLY (max 456d)

  # ── ACOS thresholds ───────────────────────────────────────────────────────
  target_acos: 0.30             # LP optimisation target; also used by campaign actions
  acos_warn_threshold: 0.30     # yellow warning line in snapshot table
  acos_crit_threshold: 0.50     # red critical line in snapshot table

  # ── Budget / CVR ──────────────────────────────────────────────────────────
  budget_exhaustion_pct: 0.90   # fraction of days budget consumed → "exhausted"
  min_clicks_for_cvr: 5         # minimum clicks required to trust a CVR estimate
  lp_headroom_factor: 3.0       # LP click ceiling = headroom × observed_clicks/day

  # ── Inventory gates ───────────────────────────────────────────────────────
  inventory_risk_days: 30       # can_sell_days < N → inventory_risk flag
  stock_gate_days: 21           # effective_stock_days < N → downgrade scale-up actions to P2
  inbound_lead_days: 30         # assumed FBA replenishment lead time (days)

  # ── Causal inference ─────────────────────────────────────────────────────
  ci_pe_outlier_multiplier: 5   # threshold = daily_sales * N; |point_effect| > threshold → "Skipped (outlier)"
  ci_pe_outlier_floor: 50       # absolute minimum threshold when daily_sales is zero or missing

  # ── Xiyou / organic rank ──────────────────────────────────────────────────
  enable_xiyou: true            # fetch keyword rank and market trend data
  rank_lookback_months: 6       # months of rank history to fetch (max 24)

  # ── TikTok social virality ────────────────────────────────────────────────
  enable_tiktok: false          # opt-in; requires tiktok_keyword to be set
  tiktok_keyword: ""            # shared search keyword for all ASINs in the run
  tiktok_window_days: 30        # lookback window for videos and comments

category_monopoly_analysis:
  # Weights for the 16 dimensions (sum = 1.0), sorted descending by weight
  weights:
    sales_curve_top3: 0.16      # CR3: Percentage of sales held by top 3 products
    review_curve: 0.10          # Review disparity and rating barrier (reduced: consequence of dominance, not its cause)
    brand_concentration: 0.10   # Frequency of the same brand in Top 100
    keyword_traffic: 0.10       # Click share concentration for main keywords (ABA)
    ad_traffic_ratio: 0.10      # Percentage of sponsored products + CPC bid barrier
    brand_search_monopoly: 0.08 # Fraction of core keywords led by the #1 click-share brand (search lock-in is a first-order barrier)
    ad_burden: 0.06             # Estimated ACOS vs breakeven — structural profitability barrier
    bsr_metabolism: 0.05        # BSR churn label × new_entrant_ratio — rank durability barrier
    review_integrity: 0.05      # Written/global review ratio — manipulation moat signal
    seller_background: 0.05     # Ratio of AMZ/FBA sellers vs mega-sellers
    sales_survival_space: 0.04  # Market share of products ranked 20-50 (trimmed — partial overlap with CR3)
    seller_concentration: 0.04  # Seller CR3 position — hidden multi-brand monopoly
    social_promotion_intensity: 0.03 # Virality score from TikTok/YouTube (opportunity signal, not structural barrier)
    price_compression: 0.02     # Price band convergence (CV)
    demand_trajectory: 0.01     # YOY demand trend — declining markets entrench incumbents
    deal_promotion_intensity: 0.01   # Frequency of deals on sites like Slickdeals

  # Thresholds and markers
  thresholds:
    high_monopoly_score: 60     # Red Ocean: Entry not recommended (was 75)
    high_competition_score: 55  # Medium-High: Hard entry, requires differentiation + capital
    opportunity_score: 35       # Blue Ocean: Clear opportunity (was 40)
    price_cv_compression: 0.15  # CV < 15% indicates intense price war
    ad_ratio_danger_zone: 0.40  # Ad traffic > 40% indicates high acquisition cost
    cr3_monopoly_limit: 0.60    # Top 3 > 60% share indicates duopoly/oligopoly
    review_disparity_threshold: 5.0 # Top 10 has 5x more reviews than bottom 50
    rating_hard_barrier: 4.5    # Top 10 average rating > 4.5 means no differentiation space
    mega_seller_feedback: 10000 # Feedback count that classifies a seller as an industry giant
    seller_cr3_limit: 0.40      # Top-3 sellers > 40% BSR slots = seller-level concentration
    review_ratio_ceiling: 0.15  # Written/global ratio > 15% = review manipulation signal
