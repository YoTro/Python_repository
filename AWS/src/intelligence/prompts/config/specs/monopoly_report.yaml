# NOTE: this template is prepended with assemble_report_instructions(role_id, framework_ids)
# at workflow build time. See build_category_monopoly_analysis() in category_monopoly_analysis.py.
template: |
  ### DATA QUALITY
  {data_quality}
  MANDATORY CAVEAT RULE: for any metric whose underlying data source has coverage < 50% of BSR products, you MUST prefix the claim with '(limited data — N/M ASINs)' and treat it as directional only, not a precise benchmark. Specifically:
  - If Xiyouzhaoci ≥60-day history < 50%: prefix price_trend, integrity signals 1 & 2, and churn_pattern with '(limited history — N/M ASINs)'. EXCEPTION: if seasonality_source == 'keyword_weekly_trends', do NOT apply this caveat to seasonality — keyword ABA data is independent of Xiyouzhaoci BSR history.
  - If sales estimate coverage < 50%: prefix recommended_capital and any sales-derived figure with '(estimated from thin data)'
  - If brand coverage < 50%: prefix brand concentration claims with '(limited brand data — N/M ASINs)'
  - If CPC keyword entries = 0: write 'CPC data unavailable — bid barrier analysis skipped' instead of citing bid_insight
  - If Sellersprite BSR snapshots < 2: treat bsr_churn signals as insufficient and write 'BSR metabolism data unavailable'
  NEVER present a default value (e.g. 0, Unknown, N/A) as a confirmed fact.

  DATA BREAKDOWN TABLE ROW ORDER (mandatory — render all rows in this exact sequence; this list supersedes any 'immediately after X' placement instruction elsewhere in this prompt):
    Group 0  — Monopoly Score
    Group 1  — Market Scope: Median Price · Total Est. Monthly Unit Sales · Est. Niche Monthly GMV · Category Return Rate
    Group 2  — Investment Capital: Investment Capital (Total) + Inventory + PPC Seed + Platform Fees + FBA Inbound Freight + Fixed Overhead
    Group 3  — Ad Economics: Category CVR · Median CPC · Estimated Steady-State ACOS · Breakeven ACOS · Ad Traffic Ratio · Ad Profit Drag · Ad Burden Verdict
    Group 4  — Market Health: Price Trend · BSR Composition Shift · Rating Churn Pattern · Low-Review BSR Share · Rating Collapse Rate
    Group 5  — BSR Metabolism: BSR Listing Metabolism · 3-Month Churn · 6-Month Churn · 12-Month Churn · New Entrant Ratio · Long-Term Incumbents · Returners · 6-Month Entrants (Survived) · Recent Entrants (<6mo) · Departed
    Group 6  — Demand / Seasonality: Seasonality · Demand Trend (YOY) (omit Demand Trend row if demand_trend is 'unknown')
    Group 7  — Review Integrity: Integrity Alert · Integrity: Rating History Coverage · Integrity: Review Ratio Coverage · Review-to-Sales Rate · Review-to-Sales Growth Rate
    Group 8  — Concentration: Brand CR3 (Position) · Brand CR5 (Position) · Brand CR3 (Sales) · Typical Industry CR3 (Benchmark) · HHI (Brand, Position) · Seller CR3 (Position) · HHI (Seller, Position) · Brand Search Monopoly (if non-empty)
    Group 9  — Fulfillment: FBA · FBM · AMZ · Unknown (omit types with count = 0; omit entire group if fulfillment_distribution is empty)
    Group 10 — Final Scores: Social PSI · Off-Site Deal Intensity
  Each metric's rendering format, conditions, and calculations are defined in its own instruction block elsewhere in this prompt.

  ### TASK-SPECIFIC CONTEXT
  Advising on a **{recommended_capital}** minimum launch budget ({capital_units} units × {niche_median_price} median price).
  DATA BREAKDOWN TABLE FORMAT (applies to every row in the table, no exceptions):
  - Header row MUST be exactly: `| Metric | Value | Definition |`
  - Separator row MUST be exactly: `| :--- | :--- | :--- |` — NEVER vary the dash count; never match it to cell width.
  - Definition cells: plain English, ≤ 100 characters. NO JSON, NO raw API payloads, NO multi-line text, NO formulas inside a cell.
  - If a Definition would exceed 100 chars, summarise it: keep the key number or label, cut the rest.
  - Escape any literal pipe character inside a cell as `\|` so the table does not break.
  - NEVER place the analysis_result, bid_insight JSON, or any other raw data block inside a table cell — those are rendered in their own dedicated sections.

  CAPITAL TABLE RULE: In the Data Breakdown table, Investment Capital MUST appear as FIVE consecutive rows — never collapsed into one:
    Row 1: Metric='Investment Capital (Total)' | Value='{recommended_capital}' | Definition='Subtotal × 1.20 working-capital buffer'
    Row 2: If capital_gross_units == capital_units (no return rate data): Metric='  └ Inventory ({capital_units} units, COGS {capital_cogs_pct})' | Value='{capital_inventory}' | Definition='{capital_units} units × {niche_median_price} × {capital_cogs_pct} COGS'. If capital_gross_units ≠ capital_units (return rate available): Metric='  └ Inventory ({capital_gross_units} gross units ordered to net {capital_units} sold, COGS {capital_cogs_pct})' | Value='{capital_inventory}' | Definition='{capital_gross_units} gross units × {niche_median_price} × {capital_cogs_pct} COGS (grossed up for {return_rate_pct} return rate)'
    Row 3: Metric='  └ PPC Seed ({capital_acos_pct} ACOS on {capital_units} units, ~{capital_sell_months}mo sell-through)' | Value='{capital_ppc}' | Definition='{capital_units} units × {niche_median_price} × {capital_acos_pct} ACOS'
    Row 4: Metric='  └ Platform Fees ({capital_fees_pct} on {capital_units} units)' | Value='{capital_fees}' | Definition='{capital_units} units × {niche_median_price} × {capital_fees_pct} (referral {referral_fee_pct} [{referral_fee_source}] + FBA — {fba_fee_source})'
    Row 5: Metric='  └ FBA Inbound Freight ({inbound_fee_pct} of median price, {capital_units} units)' | Value='{capital_inbound}' | Definition='AGL SZX→US FC, {inbound_freight_detail}; {capital_units} units × {niche_median_price} × {inbound_fee_pct}'
    Row 6: Metric='  └ Fixed Overhead' | Value='{capital_overhead}' | Definition='Photography, A+ content, listing'
  NEVER show a single Investment Capital row without these five sub-rows.
  BIMODAL CAPITAL RULE: tier_capitals={tier_capitals}. If tier_capitals is non-empty (bimodal market detected), append a second capital table immediately after the breakdown rows under the sub-heading '### Capital by Price Tier' with columns: Tier | Tier Median | Inventory | PPC | Fees | FBA Inbound | Overhead | Total. Warn the operator: 'The base Investment Capital above uses the overall median price which falls in the gap between tiers — choose the tier you plan to enter and use the corresponding Total as your actual budget.'
  Category Return Rate: {return_rate_pct} (source: Amazon Marketplace Product Guidance via SellerSprite — avg_return_rate_pct is the average return rate of same-type sub-categories over the past 3 months; return rate = returns ÷ total purchases in the past 3 months; e.g. under Shoes the figure is averaged across 18 sub-categories such as Women's Road Running and Men's Road Running). Add one row to the Data Breakdown table: Metric='Category Return Rate' | Value='{return_rate_pct}' | Definition='Avg return rate of same-type sub-categories, past 3 months (Amazon Marketplace Product Guidance); >5% warrants a return-buffer reserve'. If return_rate_pct is 'N/A', omit this row.
  Primary Niche: **{main_keyword}** | Related Terms: {core_keywords}
  Data Confidence (R²): **{data_confidence_r2}**

  ### DYNAMIC BENCHMARKS
  - Median Price: {niche_median_price}
  - Est. Niche Monthly Unit Sales: {niche_monthly_units} (scraped from Amazon 'X+ bought in past month' badge — unit count, NOT revenue)
  - Est. Niche Monthly GMV: {niche_monthly_gmv} (= unit_sales × median_price; use as market-size proxy)
  UNIT/REVENUE RULE: '{niche_monthly_units}' is a unit COUNT — NEVER prefix it with $. '{niche_monthly_gmv}' is revenue — always use the $ prefix. In the Data Breakdown table, report BOTH as separate rows: 'Total Est. Monthly Unit Sales' (integer, e.g. 40,694 units) and 'Est. Niche Monthly GMV' (dollar figure, e.g. $702,400). NEVER merge them into a single 'Total Est. Monthly Sales $...' row.
  - Keyword Bid Recommendations: {bid_insight}
    Structure: {{LEGACY_FOR_SALES: [...], AUTO_FOR_SALES: [...]}}. Each entry has targetingExpression (keyword + matchType) and suggestedBid (startBid / endBid). Render as a separate markdown table (NOT inside the Data Breakdown table) with header `| Keyword | Match Type | Manual CPC (LEGACY) | Auto CPC (AUTO) |` and separator `| :--- | :--- | :--- | :--- |`. One row per keyword; merge LEGACY and AUTO bids for the same keyword onto one row. LEGACY = flat manual bid. AUTO = Amazon dynamic estimate (usually higher). A large LEGACY→AUTO gap signals the platform rates this keyword as highly contested.
  - Keyword Click Concentration: {keyword_click_concentration}
    JSON array of {{keyword, top3_click_share, concentration, top_asin_brand, top_asin_click_share, phrase_cpc, exact_cpc, exact_phrase_gap}}. If non-empty, render as a compact table immediately after the Keyword Bid Recommendations table, under the sub-heading '### Keyword Click Concentration', with header `| Keyword | Top-3 Click Share | Concentration | #1 Brand | Brand Click Share | PHRASE CPC | EXACT CPC | EXACT/PHRASE Gap |` and separator `| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |`. KEYWORD LIMIT RULE: show at most 8 keywords, sorted by phrase_cpc descending; if the array has fewer than 5 entries, show all. Interpretation rules (apply in Strategic Insights — NEVER skip these when data is present):
    • concentration='fragmented' (top-3 < 30% clicks): no incumbent lock-in on this keyword — flag as a low-resistance entry angle where a new listing can gain organic click share without displacing an entrenched brand.
    • concentration='concentrated' (top-3 > 50% clicks): incumbent lock-in — a new entrant must outbid or out-convert the dominant brand to appear meaningfully; flag as high barrier.
    • exact_phrase_gap > +30%: EXACT match commands a significant premium; flag as 'PHRASE-first strategy recommended — test keyword fit at lower CPC before committing to EXACT.'
    • If top_asin_brand for a keyword matches a brand already flagged as dominant in Brand & Seller Concentration, cite the cross-signal: 'Brand X controls both BSR position share and click share on [keyword] — a dual moat.'
    If keyword_click_concentration is '[]' or empty, omit this block entirely.
  - Brand Search Monopoly: {brand_search_monopoly}
    JSON array of {{brand, keywords_led, n_keywords, keyword_lead_share, verdict}} for the top-3 brands by keyword leadership, sorted by keywords_led descending. Each entry is a brand that held the #1 click-share ASIN on one or more of the niche's core keywords. If non-empty, render ONE additional row in the Data Breakdown table immediately after the HHI (Seller, Position) row: Metric='Brand Search Monopoly (#1 Click ASIN)' | Value='{{top brand}} leads {{keywords_led}}/{{n_keywords}} keywords ({{keyword_lead_share as %}})' | Definition='Share of core keywords where this brand holds the #1 click-share listing; ≥50% = search monopoly'. If brand_search_monopoly is '[]' or empty, omit this row.
  - Review Disparity: {review_disparity}
  - Market Concentration: from concentration_data. Render as SEVEN consecutive rows in the Data Breakdown table (in this order):
    Row 1: 'Brand CR3 (Position)' | brand.cr3_position as % | 'Top-3 brands' share of BSR rank slots'
    Row 2: 'Brand CR5 (Position)' | brand.cr5_position as % | 'Top-5 brands' share of BSR rank slots'
    Row 3: 'Brand CR3 (Sales)' | brand.cr3_sales as % or '—' if null | 'Top-3 brands' share of monthly units'
    Row 4: 'Typical Industry CR3 (Benchmark)' | {industry_typical_cr3} | 'Category norm; DOJ: >40% = moderate concentration'
    Row 5: 'HHI (Brand, Position)' | brand.hhi_position to 4 dp | 'Herfindahl index: <0.10 fragmented · 0.10–0.18 moderate · >0.18 concentrated'
    Row 6: 'Seller CR3 (Position)' | if seller_id_coverage_pct < 0.50: '{{seller.cr3_position as %}}* (low coverage — {{seller.n_asins_with_seller_id}}/{{n_products}} ASINs only)' else seller.cr3_position as % or 'N/A — seller IDs unavailable' | 'Top-3 sellers' share of BSR slots; * = unreliable, <50% seller ID coverage'
    Row 7: 'HHI (Seller, Position)' | if seller_id_coverage_pct < 0.20: 'unreliable (<20% coverage)' elif seller_id_coverage_pct < 0.50: '{{seller.hhi_position to 4 dp}}* (low coverage)' else seller.hhi_position to 4 dp or 'N/A' | 'Seller-level Herfindahl index; * = treat as directional only'
  - Fulfillment Distribution: {fulfillment_distribution}
    JSON: {{n_products, n_classified, coverage_pct, breakdown: [{{type, count, pct}}, ...]}} where type is one of FBA (Fulfilled by Amazon, 3rd-party seller) / FBM (Fulfilled by Merchant) / AMZ (Amazon is both seller and shipper) / Unknown. Render ONE row per type present in 'breakdown' (omit a type entirely if its count is 0), immediately after the Market Concentration block (Row 7 above), in this order: FBA, FBM, AMZ, Unknown — Metric='Fulfillment: {{type}}' | Value='{{count}} ({{pct as %}})' | Definition per type: FBA='Ships via Amazon warehouses on behalf of a 3rd-party seller', FBM='Seller ships directly — no Amazon logistics involvement', AMZ='Amazon.com is the seller of record and fulfills the order', Unknown='Fulfillment method could not be determined from the listing'. If coverage_pct < 0.50, append '(limited data — {{n_classified}}/{{n_products}} ASINs)' to the FBA row's Value cell per the mandatory caveat rule. If fulfillment_distribution is '{{}}' or breakdown is empty, omit this block entirely.
    FULFILLMENT MIX ALERT (apply in Strategic Insights when this block renders): if FBA pct ≥ 70%, note that Amazon-fulfillment dominance means Prime-eligibility and 2-day shipping are table stakes — a new entrant using FBM risks a conversion penalty from lost Buy Box competitiveness. If AMZ pct ≥ 20%, flag that Amazon itself is a direct competitor/seller in this niche (not just the platform), which is a structural disadvantage no 3rd-party seller can out-compete on distribution cost. If FBM pct ≥ 50%, note the category tolerates self-fulfillment — lower barrier to entry on logistics, but a new entrant should weigh whether competitors' FBM status signals thin margins that can't absorb FBA fees.
  - Monopoly Score: {monopoly_score}/100 — {monopoly_status}. Render ONE row in the Data Breakdown table (Group 0 — first row, before all other rows): Metric='Monopoly Score' | Value='{monopoly_score}/100' | Definition='{monopoly_status}'.
  - Social PSI: {social_psi} ({social_verdict}). Render ONE row in the Data Breakdown table (Group 10 — Final Scores): Metric='Social PSI' | Value='{social_psi}' | Definition='{social_verdict}'. [Effective category PSI: max across keyword hashtag and top-brand hashtags. Amazon multi-word search terms rarely map to TikTok/YouTube hashtags, so brand tags are the primary proxy for whether a creator ecosystem exists around this niche. When brand-driven, social_verdict includes '(via #Brand tag)'. See Brand Social Signals below for per-brand breakdown.]
  - Brand Social Signals: {brand_social_data}
    JSON array of multi-platform social results for top BSR brands and new-entrant brands (listed within past 12 months). Each entry: {{brand, is_top_brand, is_new_entrant, psi (max across platforms), verdict (from best platform), video_count (total), n_kol (KOL count — macro/mega tier creators, ≥500K followers, summed across platforms), n_koc (KOC/micro-influencer count — nano/micro tier, <100K followers, summed across platforms), unique_creators (all unique creator accounts across platforms; YouTube creators counted but not tiered — follower data unavailable on hashtag pages), platforms: [{{name, hashtag, psi, verdict, video_count, n_kol, n_koc, unique_creators, promo_tag_ratio, native_ad_ratio, engagement_rate, organic_multiplier, hhi_concentration, recent_videos_ratio, trend, avg_views_per_video, amazon_mentions_ratio}}, ...]}}. Render as a single combined markdown table under the heading '## Brand Social Signals' after '## Weakest Rank Slot Assessment' (or after '## Dominant Brand Portfolio' / '## Brand & Seller Concentration' when optional earlier sections are omitted) and before '## Market Entry via Deficiency Fix (Recent Critical Reviews)' with columns: Brand | Best PSI | Verdict | TikTok PSI | YouTube PSI | Total Videos | KOLs | KOCs | Category | Momentum | Paid vs. Organic | Engagement | Creator Concentration | Buy-Intent Signal, and separator `| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |`. Sort by Best PSI descending.
    PRIMARY PLATFORM RULE: for each brand row, pick its primary platform = the entry in platforms[] whose psi equals that brand's top-level psi (its PSI-driving platform). Read promo_tag_ratio, native_ad_ratio, engagement_rate, organic_multiplier, hhi_concentration, trend, amazon_mentions_ratio from that entry for the Momentum–Buy-Intent Signal columns. If the brand has no platform with psi > 0, write '—' for all columns from Momentum onward.
    Column rules:
    • Brand, Best PSI, Verdict: from top-level brand entry.
    • TikTok PSI, YouTube PSI: look up psi from the platforms array by name; write '—' if the platform has psi=0 or verdict='No Tag Found'.
    • Total Videos: video_count (total across platforms). KOLs = n_kol (macro+mega influencers, typically paid engagements). KOCs = n_koc (nano+micro creators, typically organic or lower-cost seeding).
    • Category: 'Top Brand' if is_top_brand only, 'New Entrant' if is_new_entrant only, 'Top + New' if both, '—' if neither.
    • Momentum: trend from primary platform, mapped — 'accelerating'→'📈 Accelerating', 'stable'→'➡️ Stable', 'fading'→'📉 Fading', 'no_activity'/'no_data'/'insufficient_data'→'— (insufficient data)'.
    • Paid vs. Organic: promo_tag_ratio as a %, formatted '{{promo_tag_ratio as %}} paid/seeded' if promo_tag_ratio > 0.30, else '{{promo_tag_ratio as %}} paid — mostly organic'. If native_ad_ratio > 0, append ' (platform-flagged ad on {{native_ad_ratio as %}})' — this is the more authoritative subset since it comes from the platform's own ad-disclosure field, not caption-text guessing.
    • Engagement: '{{engagement_rate as %}} eng. · {{organic_multiplier}}x views/follower' (organic_multiplier = avg views per video ÷ creator follower count — virality independent of audience size; a small creator with a hit video shows a high multiplier).
    • Creator Concentration: if hhi_concentration > 0.25: '⚠️ Concentrated ({{hhi_concentration to 2dp}})' elif hhi_concentration > 0: 'Broad-based ({{hhi_concentration to 2dp}})' else '—'. (HHI here is the Herfindahl index of VIEWS by creator, not brands/sellers — same 0–1 concentration logic, different entity.)
    • Buy-Intent Signal: '{{amazon_mentions_ratio as %}} of videos mention Amazon/buy-link' — this is a caption-text proxy (link-in-bio, "Amazon finds", brand/product name), not comment sentiment; write '—' if amazon_mentions_ratio is 0.
    If brand_social_data is '[]' or empty, write one line: 'No brand social data available.'
    KOL/KOC INVESTMENT ALERT rule (apply in Strategic Insights): A brand with n_kol ≥ 3 (across platforms) is running a structured paid influencer campaign — this requires substantial capital (macro/mega fees range from $500–$50,000+ per post) and represents a meaningful off-platform moat. A brand with n_kol=0 but n_koc ≥ 5 is doing lower-cost seeding (nano/micro creators). If the category leader has n_kol ≥ 3 but new entrants have n_kol=0, flag the asymmetry: 'Incumbent brands are investing in paid KOL campaigns; new entrants without equivalent budget face an off-platform spend gap in addition to PPC costs.'
    SOCIAL PROMOTION INTENSITY ALERTS (apply in Strategic Insights, alongside the existing KOL/KOC INVESTMENT ALERT and NEW ENTRANT SOCIAL ALERT — do not duplicate, cross-reference instead):
    • PAID-SEEDING ALERT: if the category leader's primary-platform promo_tag_ratio > 0.30, state explicitly: '{{X}}% of {{brand}}'s promoted content is paid/seeded (native ad flag or #ad-style tag), not organic buzz — a new entrant benchmarking against this brand's apparent social traction is measuring ad spend, not organic demand.'
    • FRAGILE VIRALITY ALERT: if the category leader's hhi_concentration > 0.25, flag: 'A small number of creators drive most of {{brand}}'s video views (creator concentration {{hhi_concentration}}) — this channel is fragile; if those creators stop posting, visibility could collapse quickly. Contrast with a broad-based creator base, which is structurally more durable.'
    • MOMENTUM ALERT: if any top brand's trend is 'fading', flag: '{{brand}}'s social presence is losing momentum (posting volume down vs. the prior 3-month period) — a declining channel, not a stable benchmark.' If any new-entrant brand's trend is 'accelerating', flag this as the highest-conviction signal in the data that a video-first entry strategy is gaining real traction right now: name the brand and cite its engagement_rate alongside the momentum label.
    • ORGANIC-VS-PAID CROSS-CHECK: if a brand's psi is high (>50) but promo_tag_ratio is also high (>0.30) AND hhi_concentration is high (>0.25), combine all three into one sentence: this is a paid campaign concentrated in a handful of creators, not evidence of organic category-level demand — do not cite this brand's PSI alone as proof the niche has social pull.
  - Off-Site Deal Intensity: {deal_intensity}/10. Render as the FIRST of four consecutive rows in the Data Breakdown table (Group 10 — Final Scores): Metric='Off-Site Deal Intensity' | Value='{deal_intensity}/10' | Definition='Frequency of off-site deals on Slickdeals, DealNews, etc. (excludes Amazon on-site); 0–10; >7 = high buyer price-switch pressure'.
  - Off-Site Deal Avg. Discount Depth: {deal_avg_discount_pct}. Row 2: Metric='Deal Avg. Discount Depth' | Value='{deal_avg_discount_pct}' | Definition='Mean discount % across confirmed off-site deals — how deep the typical deal cuts, independent of how often deals occur'.
  - Off-Site Deal Discount Distribution: {deal_discount_distribution}. Row 3: Metric='Deal Discount Distribution' | Value='{deal_discount_distribution}' | Definition='Count of confirmed deals by depth bucket (Shallow <15% / Moderate 15-30% / Deep 30%+) — a uniform bucket means one typical promo depth; a spread across buckets means price behavior varies by seller or season'.
  - Off-Site Deal Frequency: {deal_frequency_per_month}. Row 4: Metric='Deal Frequency' | Value='{deal_frequency_per_month}' | Definition='Confirmed deals per month, from the observed date span of matched deals — cadence of price-switch opportunity, distinct from the raw deal count deal_intensity is scored on'.
  If deal_avg_discount_pct, deal_discount_distribution, or deal_frequency_per_month is 'N/A', write 'N/A — insufficient discount/date data on matched deals' as that row's Value and do not cite it as a finding elsewhere in the report.
  DEAL DEPTH NOTE (apply in Strategic Insights / Bargaining Power of Buyers when discussing deal_intensity, only if deal_avg_discount_pct is not 'N/A'): read discount depth alongside intensity, not intensity alone. High deal_intensity with SHALLOW avg discount (<15%) means frequent but token promotions — limited buyer price-switch pressure despite the high count. High deal_intensity with DEEP avg discount (30%+) means frequent AND steep promotions — strong buyer price-switch pressure, and any entrant's steady-state pricing should assume periodic deep discounting is normal in this category, not exceptional. Low deal_intensity with a high deal_frequency_per_month (many small deals bunched close together) can indicate a single aggressive seller running a promo cadence rather than category-wide price competition — do not generalize from one to the other.

  ### STEADY-STATE AD BURDEN
  Derived from market-level data only — no owned product required.
  Formula: Estimated ACOS = median_cpc ÷ (median_price × category_cvr × (1 − return_rate)). When return_rate_pct is 'N/A' the (1 − return_rate) term is omitted (equals 1). Both CPC and CVR sourced from the Amazon Ads ecosystem for internal consistency. Returns reduce effective ad revenue per click because the sale is reversed after the ad spend is already sunk.
  - Category CVR: {category_cvr} (source: {category_cvr_source})
  - Median CPC: {median_cpc}
  - Estimated Steady-State ACOS: {estimated_steady_state_acos}
  - Breakeven ACOS: {breakeven_acos} (= 1 − 30% COGS − {referral_fee_pct} referral [{referral_fee_source}] − {fba_fee_pct} FBA [{fba_fee_source}] − {inbound_fee_pct} FBA inbound freight [AGL SZX→US FC, {inbound_freight_detail}])
  - Ad Traffic Ratio: {ad_traffic_ratio} (source: xiyou_get_traffic_scores average across top-20 BSR ASINs — estimated share of orders/traffic attributable to ads vs. organic, at the CATEGORY level, not any single ASIN)
  - Ad Traffic Ratio Dispersion: {ad_traffic_ratio_stdev} stdev across the same top-20 ASINs — **{ad_traffic_dispersion_verdict}**
  - Ad Traffic Ratio vs. BSR Rank: r = {ad_traffic_rank_correlation} — **{ad_traffic_rank_verdict}**
  - Ad Profit Drag: {ad_profit_drag} (= ad_traffic_ratio × estimated ACOS; fraction of TOTAL revenue — ad + organic blended — consumed by ad spend at steady state)
  - Ad Burden Verdict: **{ad_burden_verdict}**
  In the Data Breakdown table, render these as nine consecutive rows under the group heading 'Steady-State Ad Burden'. NEVER omit category_cvr or the breakeven ACOS formula components — they are the basis for the verdict. If ad_traffic_ratio's value starts with '50% (default', append the mandatory caveat '(limited data — traffic-score API unavailable, 50% is an assumed placeholder, not observed)' to both the Ad Traffic Ratio row's Value cell and the Ad Profit Drag row's Value cell, and do NOT cite either figure as a precise benchmark in Strategic Insights — treat ad_burden_verdict as directional only in that case. The same caveat applies to the Dispersion and vs. BSR Rank rows whenever their verdict is 'unknown' (fewer than 5 ASINs returned a usable ratio) — cite them as 'insufficient data', not as a finding.
  DISPERSION & RANK-CORRELATION NOTE (apply in Strategic Insights when discussing ad burden, only if both verdicts are not 'unknown'): read dispersion and rank-correlation together, not the category-average ad_traffic_ratio alone, before concluding whether the category is winnable by outspending on ads. 'Bifurcated' dispersion means the category-average ad_traffic_ratio masks a split — some sellers are organically driven and others are ad-reliant — so a single blended figure understates the range a new entrant could land in. 'Organic moat' rank-correlation means the best-ranked ASINs earn their position with LESS ad reliance, not more — a new entrant should not assume outbidding on ads alone will reach the top ranks; some organic differentiation (reviews, listing quality, brand) is required. 'Ad-defended' rank-correlation means the opposite: top-ranked ASINs are MORE ad-reliant, i.e. incumbents are actively spending to defend their position — a new entrant should expect sustained, not one-time, ad spend to unseat them. 'Mixed' means no clear pattern — treat rank position as uninformative about ad strategy.
  ORGANIC SUBSIDY NOTE (apply in Strategic Insights when discussing ad burden): ad_profit_drag is a BLENDED figure — it already accounts for the fact that only ad_traffic_ratio's share of orders carries the ACOS cost, while the remaining (1 − ad_traffic_ratio) share of orders is organic and carries no ad cost. A high estimated_steady_state_acos does not by itself mean the category is unprofitable to enter if ad_traffic_ratio is low — organic orders can subsidize unprofitable ad orders. Conversely, a moderate ACOS combined with a high ad_traffic_ratio (most orders are ad-driven) means there is little organic volume left to absorb the drag, and the blended economics move closer to the raw ACOS figure. Always read ad_traffic_ratio and estimated_steady_state_acos together, not estimated_steady_state_acos alone, when assessing whether the category is structurally profitable.

