    FORMAT for the Risk & Opportunity Assessment paragraph: open with the 2-axis label in bold (e.g. **PRICE ELASTICITY TRAP**), state the YOY figures, name the root cause hypothesis in one sentence, then give the actionable conclusion (enter / enter with caution / avoid). Never use the label alone without the supporting data.
  - NEW ENTRANT ALERT: If new_entrant_ratio > 40%, the category has low moat — many new products are breaking into the top-100, which means low ranking stickiness but also means a new entrant has a realistic shot. If < 15%, incumbents dominate and new entries rarely survive in the ranking.
  - INTEGRITY ALERT: If integrity_alert is 'HIGH', explicitly warn that this category has a severely compromised compliance environment — widespread fake review injection or coordinated negative review attacks are likely. New entrants should budget for additional compliance overhead, and the true review barrier is likely higher than the raw data suggests. Combine with review_disparity to assess whether high-review incumbents are defensible or artificially inflated.
  - INTEGRITY SWOT PLACEMENT (apply whenever integrity_alert is not 'LOW'):
    • T1 (Threat — Review Attacks) — ALWAYS include when integrity_alert is MEDIUM or HIGH: 'Coordinated negative-review attacks are an asymmetric threat to a new listing with no review buffer. A HIGH integrity environment means a competitor can sink your launch-phase ASIN before organic velocity builds. Budget for early review monitoring and appeal reserves.' Cite integrity_alert level and integrity_hist_cov / integrity_ratio_cov coverage figures.
    • T2 (Threat — Rating Inflation Trap) — apply when integrity_alert is 'MEDIUM' or 'HIGH' AND the category has inherent product-effectiveness variability. A category has inherent variability when performance is co-determined by factors the product cannot control: environmental conditions (humidity, temperature, infestation density), user behaviour (placement, dosage, frequency), or individual physiology (supplements, skincare). In such categories, genuine organic ratings cluster in the 3.7–4.2 range because a meaningful fraction of buyers experience below-expectation results through no fault of the product. When most competitors have inflated to 4.3+ via brushing (evidenced by high review_ratio and integrity_alert), an honest new entrant's authentic rating falls below the manipulated industry baseline. Amazon's ranking algorithm and search-result CTR both weight star rating directly — a genuine 3.9 is algorithmically treated as inferior to a manipulated 4.5 regardless of product quality. State this explicitly: 'The industry rating baseline in this category is artificially elevated by widespread review manipulation. A genuinely-rated product in a variable-effectiveness niche would naturally score 3.7–4.2; incumbents showing 4.4+ are almost certainly brushed. An honest new entrant will sit below this manipulated floor and face a structural conversion handicap that PPC spend cannot fully compensate. Factor this into launch expectations and review acquisition strategy.' GUARD: do NOT apply T2 to categories where uniform high ratings are plausibly genuine — commoditised products with deterministic, user-independent outcomes (cables, batteries, storage containers, measuring tools). Apply only when you can identify at least one concrete effectiveness variable that the product cannot control.
    • O (Opportunity) — include when review_disparity > 3x OR integrity_alert is 'HIGH': 'Incumbent review counts may be artificially inflated (integrity_alert={integrity_alert}, review_disparity={review_disparity}). A genuine-quality entrant building authentic reviews at a lower absolute count can achieve equivalent conversion — the real review floor is lower than raw numbers suggest.' NEVER write this Opportunity without citing the specific review_disparity figure and the integrity signal that supports it.
    • If integrity_alert is 'LOW', omit all bullets from SWOT entirely — do not manufacture a risk that the data does not support.
  - NEW ENTRANT SOCIAL ALERT: Examine brand_social_data for entries where is_new_entrant is true. The 'psi' field is the maximum across all platforms; check 'platforms' for per-platform detail.
    • If any new-entrant brand has psi > 30: flag that recently-listed brands are already running active social campaigns (cite which platform(s) dominate) — external video promotion is likely a prerequisite for traction in this category, not an optional growth lever. Name each such brand and their PSI explicitly.
    • If a brand has BOTH is_top_brand AND is_new_entrant true: call this a 'breakout pattern' — a brand that entered within the last 12 months and is simultaneously dominant in BSR rank AND social. This is the highest-conviction signal that a video-first launch strategy works here; cite the brand name, PSI, and which platform(s) are strongest.
    • If all new-entrant brands have psi ≤ 30 (or brand_social_data has no new-entrant entries): note that new entrants are not yet promoting on social at scale — the category still relies primarily on internal PPC. An external-promotion-first entrant may have a first-mover advantage.
    • If top brands score high on one platform but new entrants are active on a different platform: flag the platform split — incumbents and challengers may be competing on different channels simultaneously.
    NEVER skip this alert if brand_social_data is non-empty. Combine with social_psi (category keyword signal) to distinguish between category-level buzz and brand-specific campaigns.
  - PORTER'S FIVE FORCES — DIRECTION RULE (CRITICAL): In Porter's Five Forces, the 'Threat' rating refers to how easy it is for a new player or substitute to enter and succeed — NOT how hard the barriers are. The direction is always the INVERSE of barrier height. MANDATORY mappings from this report's data:
    • Threat of New Entrants: LOW when new_entrant_ratio < 15% OR avg_reviews_top10 > 5,000 OR review_disparity > 5x — high barriers mean low threat. HIGH only when new_entrant_ratio > 40% AND review barrier is low.
    • Bargaining Power of Buyers: HIGH when deal_intensity > 7 (off-site deal frequency on Slickdeals, DealNews, etc.) OR price compression is severe (many sellers forced to discount). LOW when buyers have few alternatives.
    • Threat of Substitutes: HIGH when related keywords dominate search volume; LOW when the product category is specific and has no close alternatives.
    • Rivalry: HIGH when CR3 < 30% (fragmented competition, many rivals) OR churn is high. LOW when a few brands dominate and competition is stable.
    • Supplier Power: LOW for commodity inputs (most physical goods); HIGH only when key raw materials are scarce or proprietary.
  FORBIDDEN: do NOT write 'Threat of New Entrants: High' and then explain high review barriers or low new_entrant_ratio — those data points map to LOW threat. If you catch yourself writing this, flip the label to match the evidence.
  - BRAND SEARCH MONOPOLY ALERT: brand_search_monopoly={brand_search_monopoly}. Evaluate the top entry only. Apply in Strategic Insights when brand_search_monopoly is non-empty:
    • verdict='monopoly' (keyword_lead_share ≥ 50%): '{{brand}} holds the #1 click-share ASIN on {{keywords_led}}/{{n_keywords}} ({{keyword_lead_share as %}}) of core keywords — a search-traffic monopoly. This is distinct from BSR position share: regardless of which keyword a buyer types, this brand intercepts the majority of click volume. PPC entry has no keyword-isolation angle; every bid directly contests this brand. Classify as a structural PPC barrier on top of any BSR concentration already cited.'
    • verdict='dominant' (30% ≤ keyword_lead_share < 50%): '{{brand}} leads the click-share position on {{keywords_led}}/{{n_keywords}} ({{keyword_lead_share as %}}) of core keywords — search dominance, not a full monopoly. Fragmented keywords (concentration=fragmented in the Keyword Click Concentration table) offer lower-resistance entry angles.'
    • verdict='notable' (keyword_lead_share < 30%): no alert needed — search traffic is distributed across brands, consistent with a fragmented market.
    CROSS-SIGNAL RULE: if the brand flagged here is the same as the top brand in Brand & Seller Concentration (CR3/HHI) AND in Dominant Brand Portfolio (if present), cite all three together: '{{brand}} holds a triple moat — BSR position share, search traffic leadership ({{keywords_led}}/{{n_keywords}} keywords), and portfolio depth. Entry difficulty is compounded: displacing this brand requires out-performing it on BSR rank, click-through rate, and keyword coverage simultaneously.'
    If brand_search_monopoly is '[]' or empty, omit this alert entirely.
  - DOMINANT BRAND PORTFOLIO ALERT: If the ## Dominant Brand Portfolio section was triggered, the portfolio structure verdict MUST be cited in Strategic Insights — one of the following (select by verdict):
    • Hero SKU: 'The dominant brand's position rests on a single ASIN — a challenger that out-executes on that ASIN's top fixable complaint (cite critical_reviews) faces no portfolio depth to absorb the attack. Displacement is binary: win the hero SKU or don't enter.'
    • Segmented Ladder: 'The dominant brand runs a deliberate price ladder — attacking one tier will not dislodge the brand. The most viable entry is the inter-tier price gap identified in Flank Vulnerability; cite the specific dollar range.'
    • Balanced Portfolio: 'The dominant brand holds {{share}}% across {{n}} balanced ASINs — this is a deep portfolio moat, not a hero-SKU dependency. Raise the competitive barrier assessment by one level; direct confrontation is inadvisable without a structural product differentiation.'
    • Emerging Portfolio: 'Dominant brand portfolio structure is indeterminate (only 2 visible ASINs in sample). Focus entry advice on the per-ASIN weaknesses in the table rather than brand-level generalizations.'
    NEVER omit the portfolio structure verdict from Strategic Insights when this section renders. NEVER cite this section's verdict if the section was not triggered (dominant_brand_portfolio empty or trigger thresholds not met).
  - AD BURDEN ALERT: If ad_burden_verdict is 'Critical', ACOS exceeds 1.5× breakeven — ad-driven entry is structurally loss-making at scale; flag as P0 risk and require a COGS advantage or price premium before entry. If 'High', ACOS meets or exceeds breakeven — organic profit cannot cover ad losses; flag as a major risk. If 'Moderate', ACOS is within 70-100% of breakeven — marginal; advise careful bid management. If 'Low', ads are profitable at this price point — use as a positive entry signal. ALWAYS cite {estimated_steady_state_acos} vs {breakeven_acos} side-by-side when discussing ad burden.
