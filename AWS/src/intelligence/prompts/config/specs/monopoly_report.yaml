  ### CRITICAL REVIEWS ANALYSIS (Recent ≤90 days, stratified sample)
  {critical_reviews_data}
  This JSON contains recent critical reviews (1–3 stars, ≤90 days old) collected via stratified sampling across three market segments. Each entry carries a 'stratum' field:
    • 'leaders'     — BSR rank 1–10 products (up to 2 brands): what even the best incumbents get wrong
    • 'mid_tier'    — BSR rank 11–30 (up to 2 brands, excluding leaders): challenger-segment weaknesses
    • 'new_entrant' — products listed within the last 12 months that reached BSR (up to 1 brand): what recent entrants are still failing to fix
  Sampling across strata prevents top-brand complaints from dominating; cross-stratum themes carry the highest signal value.
  RENDER under the heading '## Market Entry via Deficiency Fix (Recent Critical Reviews)' immediately after the Brand Social Signals section and before Compliance & Regulatory Risk.
  ANALYSIS STEPS (apply in order):
  1. For each ASIN, extract recurring complaint themes from 'title' and 'content'. Merge near-duplicates (e.g. 'broke after two weeks' + 'cheap plastic' → 'Build Quality'). Count how many reviews per theme per ASIN.
  2. Sort themes by total helpful_votes across all ASINs (buyer-impact proxy). Prefer verified-purchase (is_verified=true) reviews as primary evidence.
  3. Classify each theme:
     - FIXABLE: QC failures, unclear instructions, packaging defects, missing accessories, size/calibration errors, features that better sourcing could provide. These are entry opportunities.
     - STRUCTURAL: Trade-offs intrinsic to the product type, regulatory constraints, or price-floor issues no entrant can solve without a fundamentally different product.
  4. Scope classification — CRITICAL for interpretation:
     - CATEGORY-WIDE PAIN POINT: theme appears in ≥2 ASINs from different strata (strongest entry signal — even market leaders and challengers share this flaw).
     - CROSS-STRATUM (same tier): theme appears in ≥2 ASINs within one stratum only.
     - BRAND-SPECIFIC WEAKNESS: theme appears in only one brand's ASIN (competitor's unique flaw, not a category opportunity).
  5. Render a compact markdown table: Complaint Theme | # Reviews | Helpful Votes | Type (Fixable/Structural) | Scope | Strata Affected
  6. Close with a one-line verdict: 'New-entrant fix-it viability: HIGH / MEDIUM / LOW — [1-2 sentence rationale citing the top fixable, category-wide complaint and which strata it spans]'
  GUARD RULES:
  - If critical_reviews_data is '{{}}' or all ASINs returned 0 recent reviews, write: 'No recent critical reviews (≤90 days) collected — product quality cannot be assessed from this data.' and skip the table.
  - All reviews in this dataset have already been pre-filtered in Python: logistics/shipping complaints and "works as designed" disclaimers are removed before reaching this prompt. Do NOT re-introduce those categories as structural complaints — they are absent by design, not by omission.
  - NEVER cite a complaint absent from the provided review text. Do not generalise beyond what reviewers wrote.
  - A single 1-star rant is not a structural flaw. Require ≥3 corroborating reviews to label a theme STRUCTURAL.
  - If helpful_votes = 0 for all reviews, sort by rating (lowest first) as severity proxy.
  - NEVER conflate stratum rank with complaint severity — a mid-tier flaw that spans all three strata outranks a leaders-only flaw.

  ### ADDITIONAL TACTICAL RULES
  - 400-550 words. No filler.
  - ANALYZE BID BARRIERS: Compare the suggested CPC to the median price. If CPC > 10% of median price, highlight extreme capital risk.
  - Identify which specific keywords are 'High Barrier' and if PHRASE/EXACT gaps offer opportunities.
  - CHURN ALERT: If churn_pattern is 'predatory_competition' or 'lemon_market', dedicate a paragraph to survival risk and whether the category is worth entering at all.
  - BSR METABOLISM ALERT: If bsr_churn_label is 'fomo_spike_die', warn that this is a trend-driven category where products spike and die — advise on quick-in/quick-out strategy or avoidance. If 'blue_ocean', highlight that new entrants CAN sustain rankings and explain why. If 'mature_stable', cite the low churn rates (bsr_churn_3m / bsr_churn_6m / bsr_churn_12m from the Data Breakdown table) as evidence that incumbents are deeply entrenched, and advise on the differentiation required to displace them.
  - BSR LIFECYCLE ALERT (skip entirely if bsr_lifecycle_incumbents is 'N/A'): read the composition mix, not the aggregate churn rate alone. If Recent Entrants (<6mo) is high AND Departed is also high, the category floods and flushes new listings quickly — low entry stickiness, do not assume a new listing that cracks the Top-100 will stay there. If Recent Entrants (<6mo) is high but Departed is low, new entrants ARE holding their positions once they break in — a materially more investable signal than the aggregate churn rate suggests. If Returners is notably larger than Recent Entrants (<6mo), flag that the category's apparent turnover is substantially cyclical (seasonal relistings, SKU swaps) rather than genuine new competition — call this out explicitly instead of treating it as ordinary churn.
  - SEASONALITY ALERT: If seasonality_pattern is 'strong_seasonal' or 'multi_peak_seasonal', advise on launch timing relative to peak_months and warn about off-season inventory risk.
  - DEMAND × PRICE CROSS-ANALYSIS — place the conclusion under the sub-heading '## Risk & Opportunity Assessment' in the Strategic Insights section. Skip this entire block if demand_trend is 'unknown' (write nothing — do not speculate). Otherwise, read both axes — demand_trend ({demand_trend}) and price_trend ({price_trend}) — and apply the verdict from the matrix below. Always cite the specific YOY figures (prefer yoy_peak_1y_pct, fall back to yoy_1y_pct; also cite yoy_2y_pct to distinguish a single-year dip from a multi-year trend). State the 2-axis label first, then the actionable conclusion.
    YOY DEPTH RULE: if yoy_2y_pct is also negative and steeper than yoy_1y_pct, call it 'accelerating decline'. If yoy_2y_pct is positive but yoy_1y_pct is negative, call it 'possible post-peak normalization — verify before committing'. Never collapse multi-year data into a single vague phrase.
    PRICE CAUSALITY RULE: when demand is declining or collapsing AND price_trend is 'inflating', always investigate the price-elasticity link explicitly — rising prices may be the primary cause of demand erosion, not a symptom. Name this 'Price Elasticity Trap' if the data supports it.
