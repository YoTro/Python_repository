  ### OPPORTUNITY SIGNALS
  {opportunity_signals}
  These are computed facts from this niche's data. Use them as MANDATORY anchors in the '# Actionable Prioritization' section. Rules:
  - 'review_floor_top20': the actual minimum reviews held by any BSR top-20 product. Use this as the specific target: 'You need X reviews to reach BSR #N, not X,000+.' NEVER write a generic review barrier without citing this number.
  - 'price_gap_band' + 'price_gap_count': if present, name this specific band as the underserved price point. Write: 'Only N products occupy the $X–$Y range — this is the whitespace entry point.'
  - 'least_crowded_sub_niche': if present, name this sub-niche explicitly as the recommended entry angle. Write: 'The [name] sub-segment has only N products in the top-50 — lowest competition density in this BSR.' Do NOT recommend sub-niches that are not in this data.
  - 'weakest_rank_slot': if present, cite the specific rank and review count: 'BSR #[rank] is held with only [reviews] reviews — a directly achievable displacement target.' Do NOT cite an ASIN — the data does not provide one for this signal.
  - 'compliance_accessible_angle': if present, include this as a P0 item. A new entrant avoiding FIFRA registration is a structural cost advantage, not a nice-to-have.
  - 'recent_breakthrough_examples': if present, name 1–2 product titles as proof that new entrants CAN break into this BSR within the last 12 months.
  REVIEW-FLOOR OPPORTUNITY QUALIFICATION RULE — apply whenever 'review_floor_top20' or 'weakest_rank_slot' is cited as an entry opportunity. Before declaring the opportunity viable, cross-check three gatekeeping conditions in order:
  1. Rating Collapse Risk (collapse_rate): If collapse_rate > 25%, a material fraction of BSR products suffered a post-launch rating decline — the review floor is reachable but holding rank is not guaranteed. Downgrade the verdict from 'entry viable' to 'entry viable — rank tenure at risk; see collapse_rate'. If collapse_rate > 40%, do NOT present the low-review slot as a durable opportunity at all.
  2. Monopoly Power × Incumbent Rating Floor (monopoly_score): If monopoly_score ≥ 65 AND incumbents in the top 10 carry ≥ 4.3★, a new entrant whose rating slips below ~4.2★ will face a non-linear conversion penalty. In high-monopoly categories, buyers anchor on the category leader's rating; a 0.3★ deficit compounds CTR loss with CVR loss simultaneously. PPC budget cannot fully compensate — click costs are the same but conversion is lower. State explicitly: 'Low review count is an entry criterion, not a retention criterion — sustaining rank in a monopoly requires matching the incumbent rating baseline, which requires resolving the pain points identified in critical_reviews.'
  3. Cross-Strata Fixability (critical_reviews): If the dominant complaint themes from the critical_reviews analysis are classified STRUCTURAL (not FIXABLE) AND span ≥ 2 strata (category-wide pain points), rating decline after authentic reviews accumulate is the probable trajectory — not recoverable by sourcing or QC improvements alone. Do NOT present a review-floor opportunity as durable in this scenario; the entry window closes as soon as organic reviews displace launch-phase ratings.
  COMPOSITE VERDICT: When all three conditions are adverse simultaneously (collapse_rate > 25% AND monopoly_score ≥ 65 AND structural cross-strata complaints dominant), reframe the opportunity explicitly as: 'The review floor is achievable by entry volume alone, but it is a false window — category dynamics predict a rating-driven conversion collapse that incumbents can survive behind their review and rating moat, but a new entrant cannot. Classify as P1 avoid unless the entrant has a sourcing or formulation change that structurally resolves the dominant complaint theme.'
  WHITESPACE GAP QUALIFICATION RULE — apply whenever 'price_gap_band' is cited as an entry opportunity. A price gap can mean the band is genuinely underserved, or it can mean the band is a dead zone sellers correctly avoid — too low to be profitable, too high for demand, or simply low-demand at any price. Before presenting price_gap_band as a P0/P1 opportunity, cross-check three gatekeeping conditions in order:
  1. Profitability Check: breakeven_acos is anchored to niche_median_price and is NOT directly comparable to an ACOS estimated at a different price — fba_fee_pct and inbound_fee_pct are flat per-unit dollar fees expressed as a percentage of niche_median_price, so they understate the true cost share at a lower price and overstate it at a higher price (referral_fee_pct is a genuine rate and scales correctly as-is). Do NOT compare a gap-band ACOS against the reported breakeven_acos unmodified. Instead:
    a) Compute a gap-band-specific breakeven ACOS by rescaling the flat-dollar fee terms: breakeven_acos_gap = 1 − capital_cogs_pct − referral_fee_pct − (fba_fee_pct + inbound_fee_pct) × (niche_median_price ÷ price_gap_band lower bound).
    b) Compute the gap-band ACOS using the Estimated ACOS formula from '### STEADY-STATE AD BURDEN' (median_cpc ÷ (price × category_cvr × (1 − return_rate))), substituting price_gap_band's lower bound for the price term.
    c) Compare (b) against (a), not against the reported breakeven_acos. If the gap-band ACOS exceeds breakeven_acos_gap, the band is a margin trap, not whitespace — a listing priced there cannot sustain the PPC spend needed to compete, and the trap is understated by the unadjusted benchmark whenever the gap band sits below niche_median_price. State this explicitly and do NOT recommend the band as an entry point on profitability grounds alone. This rescaling assumes the same product (hence the same flat FBA/inbound dollar fee) across the price gap — note this as an approximation if the gap band is wide enough that a materially different size/weight tier is plausible.
  2. Demand-Thinness Check: read the price_distribution bucket(s) flanking price_gap_band. If those neighboring buckets carry meaningful # Products but near-zero Sales Volume Share (sales_pct), that is evidence buyers avoid this price point (a demand desert) rather than sellers merely overlooking it (a supply desert) — downgrade the opportunity framing accordingly.
  3. Overpriced Check: if price_gap_band's lower bound sits at or above P75 of the price_distribution percentile table, treat the band as likely thin-demand premium territory, not an accessible mainstream entry point — note this explicitly rather than presenting it as a low-barrier opportunity.
  COMPOSITE VERDICT: only present price_gap_band as a genuine P0/P1 whitespace opportunity when gap-band ACOS is within breakeven_acos_gap (the rescaled benchmark from step 1, NOT the unadjusted breakeven_acos) AND the flanking buckets show non-trivial Sales Volume Share AND the band is not above P75. If any condition fails, reframe explicitly: 'The $X–$Y range is underserved by supply, but [profitability/demand/pricing] data suggests this is [a margin trap priced too low to support ad spend / a demand desert buyers avoid / premium territory outside mainstream demand], not a validated opportunity. Classify as P2 informational, not P0/P1 actionable, unless [specific condition] changes.' If price_distribution or the fields needed for these checks are unavailable, keep the original whitespace framing but append '(unvalidated — supply-side signal only; profitability and demand at this price point not independently confirmed)'.
  BIMODAL PRICING STRATEGY RULE: if price_distribution.is_bimodal is true, Actionable Prioritization MUST present tier-specific entry strategies as separate P0/P1 items — never a single blended recommendation built off the overall median (that median sits in valley_range, between the tiers, and is not itself an entry point). For each entry in price_distribution.tiers:
    - Cite that tier's Price Range, # Products, Share, and Tier Median directly from the tiers array.
    - Cite that tier's own capital requirement from the '### Capital by Price Tier' table (tier_capitals) — do NOT reuse the overall {recommended_capital} for a tier-specific recommendation.
    - State the competitive density and positioning angle specific to that tier (fewer products / lower Share = lower barrier); cross-reference price_gap_band and least_crowded_sub_niche if either falls within this tier's price range — a tier that contains the identified whitespace is a stronger candidate than one that doesn't.
    - Rank the tiers against each other with an explicit verdict per tier, e.g. 'P0: enter the $X–$Y tier — lowest capital ([tier total]), N products, overlaps the identified whitespace' vs 'P1: the $A–$B tier requires [tier total] capital and faces an entrenched CR3 — pursue only with a sourcing/COGS advantage.'
    Do NOT default to recommending whichever tier is closer to the overall median — per the Price Distribution BIMODAL RULE, that median can fall in the low-density valley between tiers, not inside either one.
  LONG-TERM SCALE REMINDER: Include a mandatory [P2] item in Actionable Prioritization, independent of the entry price this report recommends. Remind the reader that sustained profitability requires periodically re-running the profit math as volume, ACOS, COGS, fees, and return rates shift. Anchor to this report's own numbers — estimated_steady_state_acos={estimated_steady_state_acos} vs breakeven_acos={breakeven_acos}, capital_cogs_pct={capital_cogs_pct}, and current ad_burden_verdict={ad_burden_verdict} — as the reference point, not a fresh unsupported estimate. This is a reminder of what to check, not an instruction to raise, hold, or lower price; that decision belongs to the client. BIMODAL TIER RULE: if price_distribution.is_bimodal is true, address each tier's long-term pricing trajectory separately and cite each tier's median from the tiers array. A low-tier and high-tier entrant can face divergent margin dynamics as they scale, so one blanket statement is insufficient when the data shows two structurally distinct price bands. Do NOT reuse the overall estimated_steady_state_acos={estimated_steady_state_acos} and breakeven_acos={breakeven_acos} as the reference point for either tier — both are anchored to niche_median_price, which by definition sits in the low-density valley between tiers (per the Price Distribution BIMODAL RULE), not inside either one. Instead, for each tier compute: (a) estimated_steady_state_acos_tier = median_cpc ÷ (tier_median × category_cvr × (1 − return_rate)) — a direct recompute since price enters the formula linearly; (b) breakeven_acos_tier = 1 − capital_cogs_pct − referral_fee_pct − (fba_fee_pct + inbound_fee_pct) × (niche_median_price ÷ tier_median) — rescaling only the flat-dollar FBA/inbound terms, since referral_fee_pct is already a genuine rate and capital_cogs_pct is a fixed assumption. Cite estimated_steady_state_acos_tier vs breakeven_acos_tier per tier as that tier's own reference point for the long-term re-check.
